<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pixel Paddock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Pixel Paddock — pit-wall monitor at night: deep navy, timing-screen yellow, team colours */
:root{
  --bg:#0f1020; --panel:#191b31; --panel2:#24274a; --line:#393e70; --fg:#ecebdc; --dim:#8f8fb3;
  --accent:#ffcc33; --red:#ff4d5a; --green:#45d483; --blue:#4da6ff; --violet:#9b8cff;
  --px:'Press Start 2P',ui-monospace,monospace; --body:'VT323',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:22px;line-height:1.15;-webkit-font-smoothing:none;user-select:none;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 3px}
button{font:inherit;color:inherit}
input{font:inherit}
h1,h2,h3{font-family:var(--px);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:12px;color:var(--accent);letter-spacing:1px;margin-bottom:12px}
h3{font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:8px}
small{font-size:17px;color:var(--dim)}
.dim{color:var(--dim)} .acc{color:var(--accent)} .red{color:var(--red)} .green{color:var(--green)} .blue{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}

/* panels with notched pixel corners */
.panel{background:var(--panel);border:4px solid var(--line);padding:14px 16px;min-width:0;overflow-x:auto;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px)}
.panel.hl{border-color:var(--accent)}

.btn{font-family:var(--px);font-size:10px;letter-spacing:.5px;background:var(--panel2);color:var(--fg);border:0;padding:10px 12px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.5),inset 3px 3px 0 rgba(255,255,255,.14),0 0 0 3px #090a14;white-space:nowrap}
.btn:hover{background:#30345f}
.btn:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.5),0 0 0 3px #090a14;transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.sel{background:var(--accent);color:#1b1500}
.btn.go{background:#1f7a46} .btn.go:hover{background:#25904f}
.btn.warn{background:#7a2330} .btn.warn:hover{background:#922a3a}
.btn.big{font-size:13px;padding:16px 22px}
.btn.sm{font-size:8px;padding:7px 8px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ty{min-width:34px}

.top{display:flex;align-items:center;gap:22px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:4px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--px);font-size:13px;color:var(--fg);letter-spacing:1px}
.logo span{color:var(--accent);margin-left:6px}
.tb-team{display:flex;align-items:center;gap:8px;font-size:24px;margin-right:auto}
.tb-stat{display:flex;flex-direction:column;align-items:flex-end;font-size:24px;line-height:1}
.tb-stat small{font-family:var(--px);font-size:7px;margin-bottom:4px}
.tb-stat.coins{color:var(--accent)} .tb-stat.neg{color:var(--red)}
.sw{display:inline-block;width:14px;height:14px;background:var(--c);box-shadow:0 0 0 2px #000}

.wrap{max-width:1440px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.hq{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

.tabs{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
/* driver links, profile modal, inbox, finance, season matrix */
a.dl{color:inherit;text-decoration:underline dotted rgba(255,204,51,.55);text-underline-offset:3px;cursor:pointer}
a.dl:hover{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,6,14,.78);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px}
.modal-in{width:min(980px,100%);max-height:none;overflow:visible}
.modal-in p{line-height:1.25}
.pf-head{display:flex;gap:14px;align-items:flex-start}
.pf-head canvas{image-rendering:pixelated;flex:none;box-shadow:0 0 0 3px #090a14}
.pf-head>div{flex:1;min-width:0}
.pf-name{font-family:var(--px);font-size:18px;color:var(--fg);margin-bottom:6px}
.pf-x{flex:none}
.pf-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.pf-stats div{background:var(--panel2);padding:6px 8px;display:flex;flex-direction:column}
.pf-stats b{font-size:24px;color:var(--accent);font-weight:400}
.pf-pos{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.pf-pos span{display:flex;flex-direction:column;align-items:center;background:#20233f;padding:2px 0}
.pf-pos span b{font-weight:400;font-size:20px}.pf-pos span small{font-size:13px}
.abch{width:100%;height:auto;display:block}
.abch .gl{stroke:#2b2f55;stroke-width:1}.abch .ln{fill:none;stroke:var(--accent);stroke-width:2}.abch .dt{fill:var(--accent)}
.abch text{fill:var(--dim);font-size:9px;font-family:var(--body)}
.inbox{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:18px}
.mlist{max-height:640px;overflow-y:auto}
.mrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;color:var(--fg);border:0;border-bottom:2px solid #262a4a;padding:8px 4px;cursor:pointer;font:inherit}
.mrow:hover{background:#262a4a}.mrow.sel{background:#2b2f55}
.mrow b{font-weight:400;display:block}.mrow small{display:block;font-size:15px}
.mrow.new b{color:var(--accent)}.mrow.new>span:first-child::after{content:'';display:inline-block;width:6px;height:6px;background:var(--accent);margin-left:3px;vertical-align:top}
.mbody p{margin:6px 0}.mbody h3,.modal-in h3{margin-top:12px}
.youthcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.yc{background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.yc canvas{image-rendering:pixelated;margin-bottom:6px}
.finbars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-bottom:10px;border-bottom:2px solid #2b2f55}
.finbars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.finbars i{display:block;width:100%;background:var(--green)}.finbars i.neg{background:var(--red)}
.finbars small{font-size:12px}
.stars{color:#ffcc33;letter-spacing:2px;font-size:.8em}
.sttbl{margin-top:12px}.sttbl td,.sttbl th{padding:8px 12px}.sttbl td.g1{color:#ffcc33}.sttbl td.g2{color:#dfe3ea}.sttbl td.g3{color:#e0a060}.sttbl td.z{color:#4a4f78}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seat{background:var(--panel2);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.seat.open{box-shadow:0 0 0 3px var(--accent)}.seat canvas{image-rendering:pixelated}
.dzgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.dzcard{background:var(--panel);color:var(--fg);border:6px solid #090a14;box-shadow:0 0 0 4px var(--line),0 0 0 8px #090a14;font-family:var(--px)}
.dzhead{display:flex;align-items:center;gap:12px;background:var(--panel2);border-bottom:6px solid #090a14;padding:10px 12px;font-size:14px;color:var(--accent)}.dzdots i{display:inline-block;width:12px;height:12px;border:3px solid #090a14;border-radius:50%;margin-right:3px;background:var(--accent)}
.dzname{margin-left:auto;color:var(--fg);font-size:14px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dzbody{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:14px;border:4px solid #090a14;margin:10px;background:#15172d}
.dzpv{border:4px solid #090a14;border-radius:10px;overflow:hidden;background:#1d2040;display:flex;flex-direction:column}.dzpv canvas{display:block;image-rendering:pixelated;width:210px;height:228px}
.dzplate{border-top:4px solid #090a14;padding:6px;font-size:9px;text-align:center;background:var(--panel2);color:var(--accent)}
.dzstats{display:flex;flex-direction:column;gap:9px;font-size:10px;min-width:0}.dzstats>div{display:flex;justify-content:space-between;gap:6px}.dzstats b{color:var(--accent);font-weight:400}
.dzbars{display:flex;flex-direction:column;gap:8px;margin-top:8px}.dzbars div{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:8px}
.dzbars i{height:12px;border:3px solid #090a14;border-radius:8px;background:linear-gradient(90deg,var(--accent) var(--w),#2b2f55 var(--w))}
.dzfoot{padding:0 12px 12px;font-size:8px;color:var(--dim)}
.dzskill{background:var(--panel2);padding:10px;margin-bottom:8px}
.dztraits{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.dztr{background:var(--panel2);color:var(--fg);border:0;padding:10px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:3px}.dztr b{font-family:var(--px);font-size:9px;color:var(--accent);font-weight:400}.dztr.sel{box-shadow:0 0 0 3px var(--green);background:#23402f}.dztr.bad.sel{box-shadow:0 0 0 3px var(--red);background:#40232a}.dztr:disabled{opacity:.35;cursor:not-allowed}
.swatches.dz .swatch{width:30px;height:30px}
@media (max-width:860px){.dzgrid{grid-template-columns:1fr}.dzbody{grid-template-columns:1fr}.dzpv{align-self:center}.seats{grid-template-columns:1fr}}
.offer.sp.high{box-shadow:inset 3px 0 0 #b98aff}.offer.sp.excl{box-shadow:inset 0 0 0 2px #ffcc33;background:#2a2640}.offer.sp.ok{box-shadow:inset 3px 0 0 var(--green)}.offer.sp.mine{box-shadow:0 0 0 3px var(--green)}
.matrix td.c,.matrix th.c{text-align:center;padding:4px 2px;min-width:26px}
.matrix td.nm{white-space:nowrap}
.tbl tr td.p1,.tbl tr td.p2,.tbl tr td.p3,.tbl tr td.pts,.tbl tr td.p-dnf{background-clip:padding-box}
.tbl tr:nth-child(n) td.p1,.pf-pos .p1,.leg.p1{background:#8a6a12;color:#fff4c2}.tbl tr:nth-child(n) td.p2,.pf-pos .p2,.leg.p2{background:#5c6274;color:#f2f4f8}.tbl tr:nth-child(n) td.p3,.pf-pos .p3,.leg.p3{background:#7a4a24;color:#ffe2c4}.tbl tr:nth-child(n) td.pts,.pf-pos .pts,.leg.pts{background:#1f4a35;color:var(--fg)}.tbl tr:nth-child(n) td.p-dnf,.leg.p-dnf{background:#5a1a24;color:#ffb0b8}
.leg{display:inline-block;min-width:22px;text-align:center;padding:0 4px;margin:0 2px}
.qtrack{padding:6px}.qtrack canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
@media (max-width:860px){.inbox{grid-template-columns:1fr}.pf-pos{grid-template-columns:repeat(5,1fr)}}

/* rating bars */
.bar{display:inline-flex;gap:2px;vertical-align:middle}
.bar i{width:9px;height:14px;background:#2b2f55}
.bar i.on{background:var(--c,var(--accent))}
.bar.w i{width:7px}
.stat{display:grid;grid-template-columns:110px auto 1fr;align-items:center;gap:10px}
.stat .v{font-size:26px;color:var(--fg)}

.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:2px dotted #2c3060;padding:3px 0}
.kv:last-child{border-bottom:0}

table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--px);font-size:8px;color:var(--dim);text-align:left;padding:6px 8px;font-weight:400}
.tbl td{padding:3px 8px;white-space:nowrap}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.tbl tr.me td{background:rgba(255,204,51,.12);color:var(--accent)}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow:auto;max-height:520px}
.mkt{font-size:19px}.mkt td:first-child{white-space:normal;min-width:140px}.mkt td:nth-child(2){white-space:normal;min-width:90px}.mkt .trait{margin-left:3px}.mkt td .btn.sm{padding:5px 5px;font-size:7px;margin:1px 0}

.title-screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:30px}
.big-logo{font-family:var(--px);font-size:46px;line-height:1.2;text-align:center;color:var(--fg);text-shadow:4px 4px 0 #c2373f,8px 8px 0 #090a14}
.big-logo span{display:block;color:var(--accent);text-shadow:4px 4px 0 #2f6bd0,8px 8px 0 #090a14}
.title-screen canvas{width:min(960px,94vw);image-rendering:pixelated;border:4px solid var(--line);box-shadow:0 0 0 4px #090a14}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(960px,94vw)}.slot h3{margin-bottom:6px}
@media (max-width:760px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blink{font-family:var(--px);font-size:9px;color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

.pickteam{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.teamcard{text-align:left;background:var(--panel2);border:0;padding:12px;cursor:pointer;box-shadow:0 0 0 3px #090a14, inset 6px 0 0 var(--c)}
.teamcard:hover{background:#30345f}
.teamcard.sel{box-shadow:0 0 0 3px var(--accent), inset 6px 0 0 var(--c)}
.teamcard b{font-family:var(--px);font-size:10px;display:block;margin:0 0 8px 6px}
.teamcard div{margin-left:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border:0;background:var(--c);cursor:pointer;box-shadow:0 0 0 3px #090a14}
.swatch.sel{box-shadow:0 0 0 3px var(--accent)}
.field{background:#0b0c18;border:3px solid var(--line);color:var(--fg);padding:8px 10px;font-size:24px;width:100%}
.field:focus{outline:none;border-color:var(--accent)}

.trackbox canvas{width:100%;image-rendering:auto;display:block;border:3px solid #090a14}
.tag{font-family:var(--px);font-size:8px;padding:4px 6px;background:var(--panel2);display:inline-block}
.tyre{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#111;border:4px solid var(--c);font-family:var(--px);font-size:8px;color:var(--c)}

.offer{background:var(--panel2);padding:10px 12px;cursor:pointer;border:0;text-align:left;box-shadow:0 0 0 3px #090a14;width:100%}
.offer:hover{background:#30345f}
.offer.sel{box-shadow:0 0 0 3px var(--accent)}
.offer b{font-family:var(--px);font-size:10px}

/* race */
.race-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.lapc{font-family:var(--px);font-size:14px}
.race-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.cv-wrap{position:relative;background:#0b0c18;border:4px solid var(--line)}
.cv-wrap canvas{display:block;margin:0 auto;image-rendering:pixelated;aspect-ratio:400/250;max-width:100%;height:min(50vh,calc((100vw - 440px) * .625));width:auto}
@media (max-width:1100px){.cv-wrap canvas{height:auto;width:100%}}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--px);font-size:12px;padding:8px 14px;background:var(--accent);color:#1b1500;box-shadow:0 0 0 3px #090a14}
.banner.red{background:var(--red);color:#fff}
.tower{font-size:21px;padding:8px 10px}
.tower .tr{display:grid;grid-template-columns:28px 10px 1fr 26px 74px;gap:6px;align-items:center;padding:1px 2px}
.tower .tr.me{background:rgba(255,204,51,.14);color:var(--accent)}
.tower .tr.out{color:#666a8f}
.tower .p{text-align:right}
.tower .g{text-align:right}
.tower i{width:8px;height:16px;background:var(--c);display:block}
.mt{display:inline-block;width:20px;height:20px;border-radius:50%;border:3px solid var(--c);background:#111}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.pc-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rwin{display:block;width:100%;height:auto;aspect-ratio:480/120;image-rendering:pixelated;border:2px solid #2b2f55;margin-bottom:8px;background:#3a3d46}
.pc-head .nm{font-size:26px}
.pc-head .pos{margin-left:auto;font-family:var(--px);font-size:16px;color:var(--accent)}
.pc-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.pc-row .lbl{font-family:var(--px);font-size:8px;color:var(--dim);width:44px}
.wearbar{flex:1;min-width:80px;height:14px;background:#2b2f55;position:relative}
.wearbar i{position:absolute;inset:0 auto 0 0;background:var(--green)}
.log{margin-top:16px;font-size:20px;max-height:170px;overflow:auto}
.log div{padding:1px 0}
.log .me{color:var(--accent)}
.log .bad{color:var(--red)}

.qrow{display:grid;grid-template-columns:40px 14px 1fr 1fr 110px 70px;gap:8px;align-items:center;padding:2px 6px}
.qrow.me{background:rgba(255,204,51,.14);color:var(--accent)}
.qrow.new{animation:flash .5s steps(2) 1}
.qrow i{width:8px;height:16px;background:var(--c);display:block}
@keyframes flash{0%{background:var(--accent);color:#000}}
.gridspots{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;align-items:start}
.gridspots div{padding:3px 8px;border-left:6px solid var(--c);background:var(--panel2)}
.gridspots div:nth-child(even){margin-top:16px}
.gridspots .me{color:var(--accent)}
.fc{display:flex;gap:8px}
.fc div{flex:1;text-align:center;padding:6px 4px;background:var(--panel2)}
.fc b{display:block;font-family:var(--px);font-size:8px;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1b1500;font-family:var(--px);font-size:10px;padding:12px 16px;box-shadow:0 0 0 3px #090a14;z-index:9}
@media (max-width:1100px){.hq{grid-template-columns:1fr 1fr}.race-grid{grid-template-columns:1fr}}
@media (max-width:760px){.hq,.grid2,.grid3,.pcards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.qrow.new{animation:none}}

.trait{display:inline-block;font-family:var(--px);font-size:7px;letter-spacing:.5px;padding:3px 5px;margin-left:6px;vertical-align:middle;background:#2b2f55;color:var(--accent);white-space:nowrap}
.edgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
@media (max-width:420px){.edgrid{grid-template-columns:1fr}}
.edd{padding:8px 0;border-bottom:2px dotted #2c3060}
.edd:last-child{border-bottom:0}
.field.sm{font-size:20px;padding:4px 6px;min-width:0}
.field.numin{width:64px;font-size:20px;padding:4px 6px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-family:var(--px);font-size:7px;letter-spacing:.5px;padding:5px 6px;border:0;background:#2b2f55;color:var(--dim);cursor:pointer}

window.PP_WEB = true;
(() => {
  const cfg = window.PP_FIREBASE, admin = String(window.PP_ADMIN_EMAIL || '').trim().toLowerCase();
  if (!cfg || !cfg.apiKey || cfg.apiKey.startsWith('PASTE') || !window.firebase) { console.warn('Firebase not configured: saving in this browser only'); return; }
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.firestore();
  const ready = new Promise(r => { const un = auth.onAuthStateChanged(u => { un(); r(u); }); });
  const snap = s => ({ id: s.id, exists: s.exists, data: () => s.data() });
  const doc = p => { const r = fs.doc(p); return { get: async () => snap(await r.get()), set: d => r.set(d), update: d => r.update(d), delete: () => r.delete(),
    onSnapshot: (f, e) => r.onSnapshot(s => f(snap(s)), e) }; };
  const collection = p => ({ get: async () => { const q = await fs.collection(p).get(); return { docs: q.docs.map(snap), size: q.size, empty: q.empty }; } });
  window.PP_AUTH = {
    signIn: () => { const pr = new firebase.auth.GoogleAuthProvider(); pr.setCustomParameters({ prompt: 'select_account' });
      auth.signInWithPopup(pr).then(() => location.reload()).catch(e => { if (e && /popup/.test(e.code || '')) auth.signInWithRedirect(pr); else alert('Sign-in failed: ' + (e && e.message || e)); }); },
    signOut: () => auth.signOut().then(() => location.reload()),
    current: () => auth.currentUser,
  };
  window.claude = { use: async n => { const u = await ready; if (!u) return null;
    if (n === 'db') return { doc, collection };
    if (n === 'user') return { id: async () => u.uid, isOwner: async () => !!admin && String(u.email || '').toLowerCase() === admin && u.emailVerified };

const pick = a => a[Math.floor(Math.random() * a.length)];

const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

// how long a driver will sign for depends on how much they want to be with you: keen drivers sign up to 3 seasons,

function careerLeft(d) { return d.retAge == null ? 3 : Math.max(0, d.retAge - d.age + (S.phase === 'preseason' || d.pending ? 1 : 0) - (d.pending ? 1 : 0)); }   // seasons left from the contract's first season
function maxYears(d) {
  let m;
  if (d.team === S.player) { const md = moodOf(d); m = md === 'happy' ? 3 : md === 'unhappy' ? 1 : 2; }
  else { const v = S.interest?.[d.id]?.v ?? interestOf(d); m = v >= .75 ? 3 : v >= .5 ? 2 : 1; }
  return Math.min(m, Math.max(1, careerLeft(d)));
}
const conBtns = (d, act, renew) => [1, 2, 3].map(y => { const mx = maxYears(d), no = y > mx, f = contractFee(d, y);

    return topbar() + `<div class="stage"><div class="wrap">
      <div class="pod-title">ROUND ${S.round} · ${esc(trName(W.tr).toUpperCase())} GRAND PRIX</div>
      <h1 class="pod-head ${won ? 'win' : ''}">${head}</h1>
      <canvas id="podcv"></canvas>
      <div class="pod-names">${card(1)}${card(0)}${card(2)}</div>
      <p style="text-align:center" class="${mineIn ? 'acc' : 'dim'}">${won ? 'Your driver wins the Grand Prix! Champagne for the whole garage.' : mineIn ? 'A podium for your team! The crowd is on its feet.' : `Your best finish: ${myBest === 99 ? 'DNF' : 'P' + myBest}. Next time it's your turn up there.`}</p>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn big go" data-act="toresults">RESULTS &amp; COINS ▶</button></div></div></div>`;
  },
  mount() {
    const top = W.rows.filter(r => !r.dnf).slice(0, 3).map(r => ({ r, d: drv(r.d), tm: team(r.t) }));
    const mineIn = top.some(x => x.r.t === S.player), won = top[0]?.r.t === S.player;
    const cv = $('#podcv'), Wd = 480, Ht = 250; cv.width = Wd; cv.height = Ht; const g = cv.getContext('2d');
    const t0 = performance.now(), drops = [], R = mulberry32(5);
    const crowd = []; for (let k = 0; k < 160; k++) crowd.push([R() * Wd, 222 + R() * 28, pick(['#e8433a', '#ffcc33', '#f2f2f2', '#3d8fe0', '#2fbf7f', '#ff86c0', '#ff8a2a', ...top.map(x => x.tm.color)]), R() * 6]);
    const blocks = [{ k: 1, x: 96, w: 96, h: 52, c: '#c9ced6', at: .5 }, { k: 0, x: 192, w: 96, h: 74, c: '#ffcc33', at: .9 }, { k: 2, x: 288, w: 96, h: 38, c: '#d08b4a', at: .1 }];
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const frame = ts => {
      const t = reduce ? 9 : (ts - t0) / 1000; g.imageSmoothingEnabled = false;
      const sky = g.createLinearGradient(0, 0, 0, Ht); sky.addColorStop(0, '#0b0c1c'); sky.addColorStop(1, '#1d2040'); g.fillStyle = sky; g.fillRect(0, 0, Wd, Ht);
      for (let q = 0; q < 24; q++) { g.fillStyle = q % 2 ? '#f2f2f2' : '#111'; g.fillRect(q * 20, 4, 20, 5); g.fillStyle = (q + 1) % 2 ? '#f2f2f2' : '#111'; g.fillRect(q * 20, 9, 20, 5); }
      g.fillStyle = '#ffcc33'; g.font = '10px "Press Start 2P", monospace'; g.textAlign = 'center'; g.fillText(trName(W.tr).toUpperCase() + ' GP', Wd / 2, 30);
      for (const [x0, a] of [[60, .25], [240, .4], [420, .25]]) { g.fillStyle = `rgba(255,236,170,${a * (.75 + .25 * Math.sin(t * 2 + x0))})`; g.beginPath(); g.moveTo(x0 - 6, 30); g.lineTo(x0 + 6, 30); g.lineTo(x0 + 80, 220); g.lineTo(x0 - 80, 220); g.closePath(); g.fill(); }
      top.forEach((x, k) => { const fx = [40, 440, 400][k] ?? 40; g.fillStyle = '#888'; g.fillRect(fx, 60, 2, 100); for (let yy = 0; yy < 24; yy++) { const off = Math.sin(t * 4 + yy * .4) * 3; g.fillStyle = x.tm.color; g.fillRect(fx + 2 + yy * 2, 62 + off, 2, 18); } });
      // podium blocks rise
      const base = 220;
      for (const b of blocks) {
        const p = clamp((t - b.at) / .7, 0, 1), h = Math.round(b.h * (1 - Math.pow(1 - p, 3)));
        if (!top[b.k] || h <= 0) continue;
        g.fillStyle = '#2a2d4a'; g.fillRect(b.x, base - h, b.w, h); g.fillStyle = top[b.k].tm.color; g.fillRect(b.x, base - h, b.w, 4);
        g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(b.x, base - h, 6, h); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(b.x + b.w - 6, base - h, 6, h);
        if (h > 30) { g.fillStyle = b.c; g.font = '20px "Press Start 2P", monospace'; g.fillText(String(b.k + 1), b.x + b.w / 2, base - h + 34); }
      }
      // drivers drop in, then celebrate
      for (const b of blocks) {
        const x = top[b.k]; if (!x) continue; const ta = b.at + .9; if (t < ta) continue;
        const dropY = Math.max(0, 1 - (t - ta) / .4), bounce = t > ta + .4 ? Math.abs(Math.sin((t - ta) * (b.k ? 4 : 6))) * (b.k ? 2 : 5) : 0;
        const fx = b.x + b.w / 2, fy = base - b.h - dropY * 90 - bounce;
        const arms = t > 2.6 ? (b.k === 0 ? 'up' : 'one') : 'down', hold = t > 2.6 ? (b.k === 0 ? 'cup' : (t > 3.4 ? 'bottle' : 'cup')) : null;
        const hand = drawChar(g, fx, fy, x.d, x.tm, arms, 2);
        if (hold === 'cup') { const tc = trophySprite(W.tr.i); if (b.k === 0) blit(g, tc, fx - tc.width / 2, hand.top - tc.height + 4, 1); else blit(g, tc, hand.R[0] - tc.width / 2, hand.R[1] - tc.height + 2, 1); }
        if (hold === 'bottle') { drawBottle(g, hand.R[0], hand.R[1] + 4, 2); if (Math.random() < .9) for (let q = 0; q < 3; q++) drops.push({ x: hand.R[0] + 1, y: hand.R[1] - 16, vx: (b.k === 1 ? 1 : -1) * rnd(-20, 110) + (b.k === 1 ? 40 : -40), vy: rnd(-160, -60), l: 1.2 }); }
        if (b.k === 0 && t > 2.6) for (let q = 0; q < 2; q++) { const a = t * 3 + q * 3.1, sx = fx + Math.cos(a) * 40, sy = hand.top - 14 + Math.sin(a * 1.3) * 22; g.fillStyle = '#fff3b0'; g.fillRect(sx, sy - 2, 1, 5); g.fillRect(sx - 2, sy, 5, 1); }
      }
      for (const p of drops) { p.l -= 1 / 60; p.vy += 260 / 60; p.x += p.vx / 60; p.y += p.vy / 60; g.fillStyle = p.l > .6 ? '#fff6c8' : '#f2e08a'; g.fillRect(p.x, p.y, 2, 2); }
      for (let k = drops.length - 1; k >= 0; k--) if (drops[k].l <= 0) drops.splice(k, 1);
      for (const [x, y, c, ph] of crowd) { g.fillStyle = c; const j = t > 1 ? Math.max(0, Math.sin(t * 6 + ph)) * 3 : 0; g.fillRect(x, y - j, 3, 3); }
      if (!reduce) raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    if (mineIn) FX.start({ confetti: false, fireworks: won ? 1.1 : 0.5, colors: [myTeam().color, '#ffcc33', '#f2f2f2', '#ff4d5a', '#4da6ff'] });
  }
};
ACT.toresults = () => show('results');

// ---------- CHAMPIONSHIP ----------
SCREENS.champion = {

          ${tc ? `<div class="reveal" style="margin-top:14px;animation-delay:1.1s">Teams' champion: <b class="acc">${esc(tc.t.name)}</b> · ${tc.p} pts</div>` : ''}
          <div class="reveal" style="margin-top:10px;animation-delay:1.3s">Your team: <b class="${myPos <= 3 ? 'acc' : ''}">${ord(myPos)}</b> · ${tl[myPos - 1]?.p ?? 0} pts · season target ${S.targets?.[S.player] ? 'P' + S.targets[S.player] : '—'}: ${(() => { const tg = S.targets?.[S.player], r = !tg ? 'meet' : myPos < tg ? 'exceed' : myPos === tg ? 'meet' : 'fail'; return `<b class="${r === 'fail' ? 'red' : 'acc'}">${r === 'exceed' ? 'BEATEN' : r === 'meet' ? 'MET' : 'MISSED'} +${coin(SEASON_REWARD[r])}</b>`; })()}</div></div>
        <div class="panel"><h2>FINAL DRIVER STANDINGS</h2><div class="scroll" style="max-height:440px"><table class="tbl"><tr><th>POS</th><th>DRIVER</th><th>TEAM</th><th class="r">WINS</th><th class="r">POD</th><th class="r">PTS</th></tr>
          ${dl.map((x, i) => `<tr class="${x.d.team === S.player ? 'me' : ''} reveal" style="animation-delay:${(.3 + i * .06).toFixed(2)}s"><td>${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</td><td>${dlink(x.d)}</td><td>${sw(team(x.d.team)?.color ?? '#555')} ${esc(team(x.d.team)?.name ?? '')}</td><td class="r">${x.w}</td><td class="r">${pods[x.d.id] || 0}</td><td class="r">${x.p}</td></tr>`).join('')}</table></div>
          <h2 style="margin-top:14px">TEAMS</h2><table class="tbl">${tl.slice(0, 5).map((x, i) => `<tr class="${x.t.id === S.player ? 'me' : ''}"><td>${i + 1}</td><td>${sw(x.t.color)} ${esc(x.t.name)}</td><td class="r">${x.p}</td></tr>`).join('')}${myPos > 5 ? `<tr class="me"><td>${myPos}</td><td>${esc(myTeam().name)}</td><td class="r">${tl[myPos - 1].p}</td></tr>` : ''}</table></div></div>
      ${(() => { const t = myTeam(), nx = nextInv(t), res = seasonRes(S.player, tl), lvl = t.inv || 'none';
        return `<div class="panel hl" style="margin-top:18px"><h2>NEXT SEASON'S CAR</h2>
          <div class="kv"><span>Season target reward</span><span class="acc">+${coin(SEASON_REWARD[res])}</span></div>
          ${titleBonus(S.player, dl, tl) ? `<div class="kv"><span>Championship bonus${titleBonus(S.player, dl, tl) > TITLE_BONUS ? 'es (teams + drivers)' : ''}</span><span class="acc">+${coin(titleBonus(S.player, dl, tl))}</span></div>` : ''}
          <div class="kv"><span>Coins available now</span><b class="${t.coins < 0 ? 'red' : 'acc'}">${coin(t.coins)}</b></div>
          <div class="kv"><span>Development level</span><span>${INVEST[lvl].n} <small>(${invRange(lvl, t)})</small></span></div>
          ${nx ? `<div class="row" style="margin-top:8px;gap:10px"><button class="btn ${t.coins >= invStep(t, nx) ? 'go' : ''}" data-act="inv" ${t.coins >= invStep(t, nx) ? '' : 'disabled'}>UPGRADE TO ${INVEST[nx].n} · ${coin(invStep(t, nx))}</button><small class="dim">${invRange(nx, t)}</small></div>` : ''}
          <p class="dim" style="margin-bottom:0">This is the last chance to spend: coins left when the new season starts are lost, and everyone starts from 0.</p></div>`; })()}
      ${(() => { const free = spList().filter(sp => isQualified(sp, S.player) && !takenNext(sp.id, S.player)).sort((a, b) => b.pay - a.pay);
        return `<div class="panel" style="margin-top:14px"><h2>SPONSOR FOR ${S.year + 1}</h2>${S.spNext ? `<div class="kv"><span>Signed</span><b class="green">${esc(S.spNext.name)} · +${coin(S.spNext.pay)}/race</b></div>`
          : free.length ? `<p class="dim" style="margin-top:0">Last chance to sign: these sponsors are still free and you met their objective.</p>${free.map(sp => `<div class="kv"><span><b>${esc(sp.name)}</b> <small>${esc(sp.txt)}</small></span><span><b class="acc">+${coin(sp.pay)}/race</b> <button class="btn sm go" data-act="spsign" data-w="next" data-id="${sp.id}">SIGN</button></span></div>`).join('')}`
          : '<p class="dim" style="margin:0">No free sponsor left that you qualified for: without a deal you start next season with a +1 local backer.</p>'}</div>`; })()}
      <div class="row" style="justify-content:center;margin-top:20px"><button class="btn big go" data-act="champdone">ON TO SEASON ${S.year + 1} ▶</button></div></div></div>`;
  },
  mount() {

    const cv = $('#cupcv'); cv.width = cv.height = 128; const g = cv.getContext('2d'), t0 = performance.now();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    raf = requestAnimationFrame(frame);
    FX.start({ confetti: false, big: mine, fireworks: mine ? 3.2 : 0.9, colors: [col, '#ffcc33', '#f2f2f2', '#fff3b0', ...(mine ? ['#ff4d5a', '#4da6ff'] : [])] });
  }

ACT.champdone = () => { endSeason(); show('preseason'); };

// ---------- boot ----------
window.__pp = { get S() { return S; }, get W() { return W; }, get RACE() { return RACE; }, ACT, show, Race, endSeason, standings, ROUNDS };
$('#app').innerHTML = '<div class="title-screen"><h1 class="big-logo">PIXEL<span>PADDOCK</span></h1><small>Loading your career…</small></div>';
const boot = () => show(Access.state === 'ok' || Access.state === 'local' ? 'title' : 'gate');
SCREENS.gate = {
  html() {
    const st = Access.state, box = inner => `<div class="title-screen" style="gap:18px"><h1 class="acc" style="font-size:28px;letter-spacing:4px">PIXEL PADDOCK</h1><div class="panel" style="max-width:560px;width:100%">${inner}</div></div>`;
    if (st === 'nodb') return box(window.PP_WEB ? `<h2>SIGN IN TO PLAY</h2><p>Pixel Paddock saves your career online. Sign in with your Google account to start.</p><button class="btn go" data-act="gsignin">SIGN IN WITH GOOGLE</button>`
      : `<h2>SIGN IN TO PLAY</h2><p>Pixel Paddock saves your career online. Sign in to claude.ai, then open this link again.</p><p class="dim">The game's owner has to invite you first (Share menu, as Contributor).</p>`);
    if (st === 'noaccess') return box(`<h2>ASK FOR AN INVITE</h2><p>Your account can open the game but can't save yet.</p><p>Send the game's owner the email address you use for claude.ai. They add you in the <b>Share</b> menu as a <b>Contributor</b>; then reload this page.</p>`);
    if (st === 'waiting') return box(`<h2>REQUEST SENT</h2><p>Thanks, <b>${esc(Access.name)}</b>. The owner sees your name and has to accept you before you can play.</p><p class="dim blink">Waiting for approval… this page opens the game as soon as you're accepted.</p>${signOutBtn()}`);
    if (st === 'denied') return box(`<h2>NOT ACCEPTED</h2><p>The owner has not accepted <b>${esc(Access.name)}</b> for Pixel Paddock.</p>${signOutBtn()}`);
    return box(`<h2>JOIN PIXEL PADDOCK</h2>
      <label class="dim" for="gname">Your name (the owner sees it)</label>
      <input id="gname" maxlength="30" value="${esc(Access.name)}" style="width:100%;margin:6px 0 14px;padding:10px;font:inherit;background:var(--bg2,#111);color:inherit;border:2px solid var(--line)">
      <label class="row" style="gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="gok" style="width:22px;height:22px;flex:none">
        <span>I agree that the owner of Pixel Paddock can see and use my game saves to develop the game further.</span></label>
      <p id="gerr" class="red" hidden></p>
      <div class="row" style="margin-top:14px;gap:10px"><button class="btn go" data-act="gjoin">SEND REQUEST</button>${signOutBtn()}</div>`);
  },
  mount() { if (Access.state === 'waiting') Access.watch(); },
};
const signOutBtn = () => window.PP_AUTH ? `<button class="btn sm" data-act="gsignout" style="margin-top:10px">SIGN OUT</button>` : '';
ACT.gsignin = () => window.PP_AUTH && window.PP_AUTH.signIn();
ACT.gsignout = () => window.PP_AUTH && window.PP_AUTH.signOut();
ACT.gjoin = async () => {
  const name = ($('#gname')?.value || '').trim().slice(0, 30), ok = $('#gok')?.checked, err = $('#gerr');
  const fail = t => { err.textContent = t; err.hidden = false; };
  if (!name) return fail('Please enter your name.'); if (!ok) return fail('You need to agree to share your saves to play.');
  try { await Access.db.doc('players/' + Access.id).set({ name, consent: true, consentAt: Date.now(), at: Date.now() }); }
  catch (e) { Access.state = 'noaccess'; return show('gate'); }
  Access.name = name; await Access.check(); if (Access.state === 'register') Access.state = 'waiting'; boot();
};
// the owner's panel: requests, accepted players, and a read-only look at any player's saves
let PL = null;
SCREENS.players = {
  html() {
    const rows = PL?.rows || [];
    const stTag = r => r.ok === true ? '<span class="green">ACCEPTED</span>' : r.ok === false ? '<span class="red">BLOCKED</span>' : '<span class="acc blink">WAITING</span>';
    return `<div class="wrap"><div class="row" style="justify-content:space-between;margin:10px 0"><h2>PLAYERS</h2><button class="btn" data-act="totitle">BACK</button></div>
      <div class="panel"><p class="dim">${window.PP_WEB ? 'Send friends the website link. They sign in with Google, enter their name and agree to share their saves; accept them here.' : 'Friends need a claude.ai account. Invite each one by email in the <b>Share</b> menu as <b>Contributor</b>, send them the link, and accept their request here.'} Everyone listed agreed that you can read their saves.</p>
      ${!PL ? '<p class="dim">Loading…</p>' : rows.length ? rows.map(r => `<div style="border-top:2px solid var(--line);padding:10px 0">
        <div class="row" style="gap:12px;flex-wrap:wrap;align-items:baseline"><b style="font-size:18px">${esc(r.name || '?')}</b>${stTag(r)}
          <small class="dim">agreed ${r.consentAt ? new Date(r.consentAt).toLocaleDateString() : '—'}</small>
          <small class="dim">${r.last ? `${esc(r.last.team)} · ${r.last.year} round ${Math.min(r.last.round + 1, ROUNDS)} · ${new Date(r.last.at).toLocaleDateString()}` : 'not started'}</small></div>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">${r.ok !== true ? `<button class="btn go" data-act="plok" data-id="${esc(r.id)}">ACCEPT</button>` : ''}${r.ok !== false ? `<button class="btn sm warn" data-act="plno" data-id="${esc(r.id)}">BLOCK</button>` : ''}
          ${r.ok === true ? `<button class="btn sm" data-act="plsaves" data-id="${esc(r.id)}">SAVES</button>` : ''}</div>
        ${PL.open === r.id ? `<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">${(PL.saves || []).map(x => `<button class="btn sm" data-act="plview" data-id="${esc(r.id)}" data-k="${x.k}">SAVE ${x.k + 1}: ${esc(x.label)}</button>`).join('') || '<small class="dim">no saves yet</small>'}</div>` : ''}</div>`).join('') : '<p class="dim">No requests yet.</p>'}</div></div>`;
  },
  async mount() { if (!PL) await plLoad(); },
};
async function plLoad() {
  const db = Access.db; if (!db) { PL = { rows: [] }; return show('players'); }
  try {
    const [ps, as] = await Promise.all([db.collection('players').get(), db.collection('access').get()]);
    const acc = Object.fromEntries(as.docs.map(d => [d.id, d.data().ok]));
    PL = { ...(PL || {}), rows: ps.docs.map(d => ({ id: d.id, ...d.data(), ok: acc[d.id] })).sort((a, b) => (a.ok === undefined ? 0 : 1) - (b.ok === undefined ? 0 : 1) || (b.at || 0) - (a.at || 0)) };
  } catch (e) { PL = { rows: [] }; }
  show('players');
}
ACT.players = () => { PL = null; show('players'); };
ACT.plok = async d => { await Access.db.doc('access/' + d.id).set({ ok: true, at: Date.now() }).catch(() => toast('Could not save')); plLoad(); };
ACT.plno = async d => { await Access.db.doc('access/' + d.id).set({ ok: false, at: Date.now() }).catch(() => toast('Could not save')); plLoad(); };
ACT.plsaves = async d => {
  PL.open = d.id; PL.saves = []; PL.raw = {};
  await Promise.all([...Array(SLOTS)].map(async (_, k) => { try { const sn = await Access.db.doc('saves/' + d.id + '/slots/' + slotDoc(k)).get();
    if (sn.exists && typeof sn.data().s === 'string') { const sv = JSON.parse(sn.data().s); PL.raw[k] = sn.data().s; PL.saves.push({ k, label: `${sv.teams?.find(t => t.id === sv.player)?.name ?? '?'} ${sv.year}` }); } } catch (e) { } }));
  PL.saves.sort((a, b) => a.k - b.k); show('players');
};
// open a player's save to look around (and test changes): nothing is saved while viewing
ACT.plview = d => { const raw = PL?.raw?.[+d.k]; if (!raw) return; try { S = migrate(JSON.parse(raw)); } catch (e) { return toast('Save could not be read'); }
  Access.readonly = (PL.rows.find(r => r.id === d.id)?.name || 'player'); if (!S.targets) setTargets(); ensureAiPlans(); hqTab = 'overview'; show('hq'); };
ACT.plexit = () => { Access.readonly = null; S = null; show('players'); };
Store.init().then(boot);

</script>
